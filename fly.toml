# Fly.io config. Secrets (DISCORD_TOKEN, DISCORD_CLIENT_SECRET, DATABASE_URL) are set in the
# Fly dashboard under Secrets, never in this file.

app = 'xxdeadmaster-appbot'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  PUBLIC_URL = 'https://xxdeadmaster-appbot.fly.dev'
  DISCORD_CLIENT_ID = '1564128805226811394'
  GUILD_ID = '1482555990774907061'

[http_service]
  internal_port = 3000
  force_https = true
  # The bot must stay connected to Discord, so the machine never sleeps
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
