# fly.toml app configuration file generated for xxdeadmaster-appbot on 2026-10-26T05:36:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xxdeadmaster-appbot'
primary_region = 'iad'

[build]

[env]
  DISCORD_CLIENT_ID = '1564128805226811394'
  GUILD_ID = '1482555990774907061'
  NODE_ENV = 'production'
  PORT = '3000'
  PUBLIC_URL = 'https://xxdeadmaster-appbot.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
